[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x-osint"
version = "3.0.0.dev0"
description = "Modular Open Source Intelligence CLI framework (Termux & Linux friendly)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "phonenumbers>=8.13.0",
    "dnspython>=2.6.0",
]

[project.optional-dependencies]
image = ["Pillow>=10.0.0", "piexif>=1.1.3"]
web = ["Flask>=3.0.0", "qrcode>=7.4.2"]
nlp = ["spacy>=3.7.0"]
# Not listed because pip cannot build them on Termux (they need Rust):
# ruff and ty. Install both with `pkg install`.
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "vulture>=2.11",
]

[project.scripts]
xosint = "xosint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["xosint"]
branch = true
