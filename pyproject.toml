[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x-osint"
version = "3.0.0.dev0"
description = "Modular Open Source Intelligence CLI framework (Termux & Linux friendly)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "phonenumbers>=8.13.0",
    "dnspython>=2.6.0",
]

[project.optional-dependencies]
image = ["Pillow>=10.0.0", "piexif>=1.1.3"]
web = ["Flask>=3.0.0", "qrcode>=7.4.2"]
nlp = ["spacy>=3.7.0"]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
xosint = "xosint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
