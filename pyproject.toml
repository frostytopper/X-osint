[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x-osint"
version = "3.0.0.dev0"
description = "Modular Open Source Intelligence CLI framework (Termux & Linux friendly)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "phonenumbers>=8.13.0",
    "dnspython>=2.6.0",
]

[project.optional-dependencies]
image = ["Pillow>=10.0.0", "piexif>=1.1.3"]
web = ["Flask>=3.0.0", "qrcode>=7.4.2"]
nlp = ["spacy>=3.7.0"]
# ruff is not listed: pip cannot build it on Termux. Use `pkg install ruff`.
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "vulture>=2.11",
    "types-requests>=2.31.0",
]

[project.scripts]
xosint = "xosint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["src/xosint"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["xosint"]
branch = true
